name: Bug report
description: 报告可复现的软件问题
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 1.8.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请勿提交 Token、Cookie、密码、手机号或未脱敏日志。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
